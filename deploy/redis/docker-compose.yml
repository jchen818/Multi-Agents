# Redis for the agents' control plane (Phase 6.2). nfs-server only: listens on 127.0.0.1, password required,
# append-only file so queued work survives a restart.
#   cp redis.env.example ~/Multi-Agents/secrets/redis.env   # set REDIS_PASSWORD (chmod 600)
#   docker compose --env-file ~/Multi-Agents/secrets/redis.env up -d
# then in agents.env:  REDIS_URL=redis://:<password>@127.0.0.1:6379/0
services:
  redis:
    image: redis:7.4-alpine
    container_name: agents-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes",
              "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction",
              "--rename-command", "FLUSHALL", "", "--rename-command", "FLUSHDB", "", "--rename-command", "CONFIG", ""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - agents-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
volumes:
  agents-redis:
