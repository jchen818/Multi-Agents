description: Phase 3 - failure triage (gemma + bug history), 14 cases from cases.yaml
prompts: ["{{case}}"]
providers:
  - id: file://provider.py
    label: triage
    config: {pythonExecutable: /home/mitac/Multi-Agents/.venv/bin/python, timeout: 900000}
evaluateOptions: {maxConcurrency: 2}
defaultTest:
  assert: [{type: javascript, value: "file://lib.js:check"}]
